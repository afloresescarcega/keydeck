name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run KeyDeckKit unit tests
        run: swift test --package-path Packages/KeyDeckKit

      - name: Validate Apple Privacy Manifests
        run: |
          for manifest in Sources/*/PrivacyInfo.xcprivacy; do
            echo "Linting $manifest"
            plutil -lint "$manifest"
          done

      - name: Verify no personal Team ID or hardcoded secrets committed
        run: |
          if git grep -E "(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35})" -- ':!.github/workflows/ci.yml'; then
            echo "Potential hardcoded API key detected!"
            exit 1
          fi
          if test -f Config/Local.xcconfig; then
            echo "Config/Local.xcconfig must never be committed!"
            exit 1
          fi

  sonarcloud:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0  # full history for accurate blame / new-code detection

      - name: Run tests with coverage
        run: ./scripts/sonar-coverage.sh

      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

sonar.projectKey=afloresescarcega_keydeck
sonar.organization=afloresescarcega
sonar.projectName=KeyDeck

sonar.sources=Sources,Packages/KeyDeckKit/Sources
sonar.tests=Packages/KeyDeckKit/Tests
sonar.exclusions=**/*.xcassets/**,**/*.xcprivacy,**/.build/**
sonar.sourceEncoding=UTF-8

# Generated by scripts/sonar-coverage.sh
sonar.coverageReportPaths=build/sonar/coverage.xml

# Only KeyDeckKit has a test target; the app, keyboard and widget targets
# (and the static docs site) can't produce coverage, so don't count them.
sonar.coverage.exclusions=Sources/**,docs/**

# Reviewed, intentional cases. Each line also carries a `// NOSONAR: <reason>`
# comment, but the sonarcloud.io Swift analyzer doesn't honor NOSONAR.
sonar.issue.ignore.multicriteria=s107_0,s107_1,s107_2,s1075_0,s1075_1,s1075_2,s1075_3,s1075_4,s1075_5,s6288_0
# Memberwise inits of plain data models, and the keyboard view model's injected host callbacks.
sonar.issue.ignore.multicriteria.s107_0.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.s107_0.resourceKey=**/Models/*.swift
sonar.issue.ignore.multicriteria.s107_1.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.s107_1.resourceKey=**/Alfred/AlfredSearchEngine.swift
sonar.issue.ignore.multicriteria.s107_2.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.s107_2.resourceKey=Sources/KeyDeckKeyboard/KeyboardViewModel.swift
# Overridable API base URL defaults, fixed deep-link routes, preview sample values and test fixtures.
sonar.issue.ignore.multicriteria.s1075_0.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.s1075_0.resourceKey=**/AI/GeminiClient.swift
sonar.issue.ignore.multicriteria.s1075_1.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.s1075_1.resourceKey=**/AI/OpenAIClient.swift
sonar.issue.ignore.multicriteria.s1075_2.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.s1075_2.resourceKey=**/Constants/KeyDeckConstants.swift
sonar.issue.ignore.multicriteria.s1075_3.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.s1075_3.resourceKey=Sources/KeyDeckApp/KeyDeckApp.swift
sonar.issue.ignore.multicriteria.s1075_4.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.s1075_4.resourceKey=Sources/KeyDeckApp/Views/WorkflowsPlaceholderView.swift
sonar.issue.ignore.multicriteria.s1075_5.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.s1075_5.resourceKey=Packages/KeyDeckKit/Tests/**
# The keyboard extension must read API keys without a user-presence prompt;
# items are ThisDeviceOnly and only readable after first unlock.
sonar.issue.ignore.multicriteria.s6288_0.ruleKey=swift:S6288
sonar.issue.ignore.multicriteria.s6288_0.resourceKey=**/Storage/SharedKeychain.swift

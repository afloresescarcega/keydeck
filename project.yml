name: KeyDeck
options:
  bundleIdPrefix: "$(KEYDECK_BUNDLE_PREFIX)"
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: "$(KEYDECK_DEVELOPMENT_TEAM)"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  KeyDeckKit:
    path: Packages/KeyDeckKit

targets:
  KeyDeckApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/KeyDeckApp
    info:
      path: Sources/KeyDeckApp/Info.plist
      properties:
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        KeyDeckAppGroupID: "$(KEYDECK_APP_GROUP)"
        KeyDeckKeychainSuffix: "$(KEYDECK_KEYCHAIN_SUFFIX)"
        CFBundleDisplayName: KeyDeck
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSMicrophoneUsageDescription: "KeyDeck uses the microphone for Rambler dictation and Voice Edit commands."
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: "$(PRODUCT_BUNDLE_IDENTIFIER)"
            CFBundleURLSchemes:
              - keydeck
    entitlements:
      path: Sources/KeyDeckApp/KeyDeckApp.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(KEYDECK_APP_GROUP)"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(KEYDECK_KEYCHAIN_SUFFIX)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(KEYDECK_BUNDLE_PREFIX).keydeck"
        PRODUCT_NAME: KeyDeck
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: KeyDeckKit
      - target: KeyDeckKeyboard
        embed: true
      - target: KeyDeckWidgets
        embed: true

  KeyDeckKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/KeyDeckKeyboard
    info:
      path: Sources/KeyDeckKeyboard/Info.plist
      properties:
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        KeyDeckAppGroupID: "$(KEYDECK_APP_GROUP)"
        KeyDeckKeychainSuffix: "$(KEYDECK_KEYCHAIN_SUFFIX)"
        CFBundleDisplayName: KeyDeck
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
    entitlements:
      path: Sources/KeyDeckKeyboard/KeyDeckKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(KEYDECK_APP_GROUP)"
        keychain-access-groups:
          - "$(AppIdentifierPrefix)$(KEYDECK_KEYCHAIN_SUFFIX)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(KEYDECK_BUNDLE_PREFIX).keydeck.keyboard"
        PRODUCT_NAME: KeyDeckKeyboard
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    dependencies:
      - package: KeyDeckKit

  KeyDeckWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/KeyDeckWidgets
    info:
      path: Sources/KeyDeckWidgets/Info.plist
      properties:
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        KeyDeckAppGroupID: "$(KEYDECK_APP_GROUP)"
        CFBundleDisplayName: KeyDeck Widgets
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Sources/KeyDeckWidgets/KeyDeckWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - "$(KEYDECK_APP_GROUP)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(KEYDECK_BUNDLE_PREFIX).keydeck.widgets"
        PRODUCT_NAME: KeyDeckWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
    dependencies:
      - package: KeyDeckKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  KeyDeck:
    build:
      targets:
        KeyDeckApp: all
        KeyDeckKeyboard: all
        KeyDeckWidgets: all
    run:
      config: Debug
      executable: KeyDeckApp
